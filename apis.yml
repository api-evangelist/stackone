description: >-
  StackOne is a Tool Gateway that connects AI agents to business applications (550+ connectors and 34,000+ actions),
  exposed through an MCP gateway, A2A agents and a Platform API, with agent authentication, tool discovery, tool
  policies, prompt-injection defense (StackOne Defender), an agent execution engine, observability and an AI
  integration builder. Its earlier Unified APIs (HRIS, ATS, CRM, LMS, IAM, Documents, Marketing, Ticketing,
  Messaging, Screening) are legacy: no longer in active development, with existing functionality still supported.
